<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archyy</title>
<meta name="description" content="Archyy helps families in Israel discover and book kids' after-school classes, events, camps and attractions — organised together, in one place.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Archyy">
<meta property="og:title" content="Archyy — kids' activities, together">
<meta property="og:description" content="Discover and book after-school classes, events, camps and attractions for your kids — organised with your family, in one place.">
<meta property="og:image" content="https://archyy.com/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://archyy.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://archyy.com/assets/og-card.png">

<meta name="theme-color" content="#F7F3EC">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/apple-touch-icon.png">
<style>
  :root{ --bg:#F7F3EC; --ink:#2A2630; --soft:#6E6A77; --brand:#DD3B6B; --hair:#ECE6DC; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:
      radial-gradient(60% 42% at 50% 8%, rgba(221,59,107,.08), transparent 70%),
      var(--bg);
    color:var(--ink); min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:calc(32px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom));
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:560px}
  .wordmark{height:56px; width:auto; margin:0 auto 6px}
  .mascot{width:230px; max-width:62vw; height:auto; margin:6px auto 4px; display:block;
    filter:drop-shadow(0 20px 26px rgba(120,40,70,.18))}
  h1{font-size:clamp(26px,6vw,36px); line-height:1.15; letter-spacing:-.4px; margin:14px auto 10px; max-width:16ch; text-wrap:balance}
  p.lede{font-size:clamp(15px,3.6vw,18px); line-height:1.55; color:var(--soft); margin:0 auto; max-width:40ch}
  .soon{margin-top:28px; font-size:14px; font-weight:700; color:var(--brand); letter-spacing:.02em}
  footer{margin-top:28px; font-size:12.5px; color:var(--soft)}
  footer a{color:var(--soft)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#171320; --ink:#F3EEF6; --soft:#A79FB2; --hair:#352C46; --brand:#FF5A86}
    body{color-scheme:dark}
  }
</style>
</head>
<body>
  <main>
    <img class="wordmark" src="/assets/wordmark.png" alt="Archyy">
    <img class="mascot" src="/assets/mascot.png" alt="Archyy mascot waving">
    <h1>Kids' activities, together.</h1>
    <p class="lede">Discover and book activities, private lessons and entertainment for your children — organised with your whole family, in one place.</p>
    <p class="soon">Coming soon to iPhone</p>
    <footer>
      <a href="/privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="/terms.html">Terms</a> &nbsp;·&nbsp; hello@archyy.com
    </footer>
  </main>
</body>
</html>
